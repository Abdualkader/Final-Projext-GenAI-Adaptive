      margin: 0 0 6px 0;
      direction: rtl;

      margin: 0 0 16px 0;

      width: 100%;
      height: 6px;
      background: #F1F5F9;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #8B5CF6);
      border-radius: 8px;
      animation: loading-bar-move 1.4s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes loading-bar-move {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 30%; }

      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            audioCtx = new AudioCtx();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Unlock browser audio context and preload voices on user interaction
      function unlockAudio() {
        const ctx = getAudioContext();
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        if (window.speechSynthesis) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          if (window.speechSynthesis.getVoices) {
            window.speechSynthesis.getVoices();
          }
        }
      }
      ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function(evt) {
        document.addEventListener(evt, unlockAudio, { passive: true });
      });

      if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = function() {
          window.speechSynthesis.getVoices();
        };
      }

      // Sensory-friendly celebration and gentle retry chimes via Web Audio API
      window.playAsdChime = function(isSuccess, volume) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          const vol = typeof volume === 'number' ? Math.max(0, Math.min(1, volume)) : 0.8;
          const masterGain = ctx.createGain();
          masterGain.connect(ctx.destination);
          masterGain.gain.setValueAtTime(vol * 0.35, ctx.currentTime);

          if (isSuccess) {
            // Gentle star celebration arpeggio: C5 (523.25), E5 (659.25), G5 (783.99)
            const notes = [
              { freq: 523.25, time: 0.00, dur: 0.20 },
              { freq: 659.25, time: 0.10, dur: 0.20 },
              { freq: 783.99, time: 0.20, dur: 0.40 },
            ];
            notes.forEach(function(n) {
              const osc = ctx.createOscillator();
              const noteGain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.time);
              noteGain.connect(masterGain);
              noteGain.gain.setValueAtTime(0, ctx.currentTime + n.time);
              noteGain.gain.linearRampToValueAtTime(0.8, ctx.currentTime + n.time + 0.02);
              noteGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.time + n.dur);
              osc.connect(noteGain);
              osc.start(ctx.currentTime + n.time);
              osc.stop(ctx.currentTime + n.time + n.dur);
            });
          } else {
            // Gentle warm retry chime: G4 (392.00) -> F4 (349.23)
            const notes = [
              { freq: 392.00, time: 0.00, dur: 0.18 },
              { freq: 349.23, time: 0.12, dur: 0.28 },
            ];
            notes.forEach(function(n) {
              const osc = ctx.createOscillator();
              const noteGain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.time);
              noteGain.connect(masterGain);
              noteGain.gain.setValueAtTime(0, ctx.currentTime + n.time);
              noteGain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + n.time + 0.02);
              noteGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.time + n.dur);
              osc.connect(noteGain);
              osc.start(ctx.currentTime + n.time);
              osc.stop(ctx.currentTime + n.time + n.dur);
            });
          }
        } catch (err) {
          console.warn('playAsdChime warning:', err);
        }
      };

      window._activeAsdAudio = null;
      window._activeUtterances = window._activeUtterances || [];

        'h': 'حَاءْ', 'kh': 'خَاءْ', 'd': 'دَالْ', 'dh': 'ذَالْ', 'r': 'رَاءْ',
        'z': 'زَايْ', 's': 'سِينْ', 'sh': 'شِينْ', 'sad': 'صَادْ', 'dad': 'ضَادْ',
        't2': 'طَاءْ', 'zh': 'ظَاءْ', 'f': 'فَاءْ', 'q': 'قَافْ', 'k': 'كَافْ',
        'l': 'لَامْ', 'm': 'مِيمْ', 'n': 'نُونْ', 'ha': 'هَاءْ', 'w': 'وَاوْ', 'y': 'يَاءْ'
      };

      const ARABIC_NUMBER_RULES = {
        '1': 'وَاحِدْ', 'one': 'وَاحِدْ', 'وَاحِد': 'وَاحِدْ',
        '2': 'اِثْنَانْ', 'two': 'اِثْنَانْ', 'اِثْنَان': 'اِثْنَانْ',
        '3': 'ثَلَاثَةْ', 'three': 'ثَلَاثَةْ', 'ثَلَاثَة': 'ثَلَاثَةْ',
        '4': 'أَرْبَعَةْ', 'four': 'أَرْبَعَةْ', 'أَرْبَعَة': 'أَرْبَعَةْ',
        '5': 'خَمْسَةْ', 'five': 'خَمْسَةْ', 'خَمْسَة': 'خَمْسَةْ',
        '6': 'سِتَّةْ', 'six': 'سِتَّةْ', 'سِتَّة': 'سِتَّةْ',
        '7': 'سَبْعَةْ', 'seven': 'سَبْعَةْ', 'سَبْعَة': 'سَبْعَةْ',
        '8': 'ثَمَانِيَةْ', 'eight': 'ثَمَانِيَةْ', 'ثَمَانِيَة': 'ثَمَانِيَةْ',
        '9': 'تِسْعَةْ', 'nine': 'تِسْعَةْ', 'تِسْعَة': 'تِسْعَةْ',
        '10': 'عَشَرَةْ', 'ten': 'عَشَرَةْ', 'عَشَرَة': 'عَشَرَةْ'
      };

      // Helper to synthesize a gentle sensory audio tone if all speech options fail
      function playSensoryFallbackTone(freq, duration) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq || 523.25, ctx.currentTime);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.001, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.4));
          osc.connect(gain);
          osc.start();
          osc.stop(ctx.currentTime + (duration || 0.4));
        } catch (_) {}
      }

      // Plays authentic native Arabic human speech stream (works on Windows, Mac, iOS, Android)
      function playArabicHumanAudio(spokenText, vol, onFallback) {
        try {
          const encoded = encodeURIComponent(spokenText);
          const gUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=' + encoded;
          const rvUrl = 'https://code.responsivevoice.org/getvoice.php?t=' + encoded + '&tl=ar';

          window.stopAsdAudio();

          const audio = document.createElement('audio');
          audio.setAttribute('referrerpolicy', 'no-referrer');
          audio.referrerPolicy = 'no-referrer';
          // NOTE: Do NOT set crossOrigin! Unset crossOrigin allows cross-origin audio streaming without CORS headers.
          audio.volume = vol;
          window._activeAsdAudio = audio;

          var triedFallback = false;
          function doFallback() {
            if (triedFallback) {
              if (onFallback) onFallback();
              return;
            }
            triedFallback = true;
            try {
              const fallbackAudio = document.createElement('audio');
              fallbackAudio.setAttribute('referrerpolicy', 'no-referrer');
              fallbackAudio.referrerPolicy = 'no-referrer';
              fallbackAudio.volume = vol;
              window._activeAsdAudio = fallbackAudio;
              fallbackAudio.onerror = function() {
                if (onFallback) onFallback();
              };
              fallbackAudio.src = rvUrl;
              const p2 = fallbackAudio.play();
              if (p2 !== undefined) {
                p2.catch(function() {
                  if (onFallback) onFallback();
                });
              }
            } catch (_) {
              if (onFallback) onFallback();
            }
          }

          audio.onerror = doFallback;
          audio.src = gUrl;
          const p = audio.play();
          if (p !== undefined) {
            p.catch(function(err) {
              console.warn('Google TTS play failed, trying fallback:', err);
              doFallback();
            });
          }
        } catch (e) {
          if (onFallback) onFallback();
        }
      }

      // Web Speech API synthesis fallback
      function fallbackToWebSpeech(spokenText, targetLang, vol) {
        try {
          if (!window.speechSynthesis) {
            playSensoryFallbackTone(523.25, 0.3);
            return;
          }

          const utterance = new SpeechSynthesisUtterance(spokenText);
          utterance.lang = targetLang;
          utterance.volume = vol;
          const isAr = targetLang.startsWith('ar');

          if (isAr) {
            utterance.rate = 0.82;
            utterance.pitch = 1.0;
          } else {
            utterance.rate = 0.88;
            utterance.pitch = 1.05;
          }

          const voices = window.speechSynthesis.getVoices() || [];
          var matchedVoice = null;
          if (voices.length > 0) {
            if (isAr) {
              matchedVoice = voices.find(function(v) {
                const name = (v.name || '').toLowerCase();
                const vLang = (v.lang || '').toLowerCase();
                return (
                  vLang.startsWith('ar') ||
                  vLang.includes('ar-') ||
                  name.includes('arabic') ||
                  name.includes('عربي') ||
                  name.includes('saudi') ||
                  name.includes('naayf') ||
                  name.includes('hoda') ||
                  name.includes('maged') ||
                  name.includes('tarik') ||
                  name.includes('laila') ||
                  name.includes('salma') ||
                  name.includes('shakir') ||
                  name.includes('zariyah')
                );
              });
            } else {
              matchedVoice = voices.find(function(v) {
                const vLang = (v.lang || '').toLowerCase();
                return vLang.startsWith('en') && (vLang.includes('us') || vLang.includes('gb'));
              }) || voices.find(function(v) {
                return (v.lang || '').toLowerCase().startsWith('en');
              });
            }

            if (matchedVoice) {
              utterance.voice = matchedVoice;
              utterance.lang = matchedVoice.lang;
            }
          }

          window.stopAsdAudio();
          window._activeUtterance = utterance;
          utterance.onend = function() {
            window._activeUtterance = null;
          };
          utterance.onerror = function(e) {
            window._activeUtterance = null;
          };

          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }

          window.speechSynthesis.speak(utterance);
        } catch (err) {
          console.warn('fallbackToWebSpeech exception:', err);
          playSensoryFallbackTone(523.25, 0.3);
        }
      }

      // Natural speech pronunciation for vocabulary and questions in English & Arabic
      function speakTextDirect(text, lang, volume) {
        try {
          if (!text || typeof text !== 'string' || !text.trim()) return;
          const vol = typeof volume === 'number' ? Math.max(0, Math.min(1, volume)) : 0.8;
          const isAr = (lang === 'ar') || /[\u0600-\u06FF]/.test(text);

          var spokenText = text.trim();

          if (isAr) {
            const lowerKey = spokenText.toLowerCase();
            if (ARABIC_LETTER_RULES[spokenText]) {
              spokenText = ARABIC_LETTER_RULES[spokenText];
            } else if (ARABIC_LETTER_RULES[lowerKey]) {
              spokenText = ARABIC_LETTER_RULES[lowerKey];
            } else if (ARABIC_NUMBER_RULES[spokenText]) {
              spokenText = ARABIC_NUMBER_RULES[spokenText];
            } else if (ARABIC_NUMBER_RULES[lowerKey]) {
              spokenText = ARABIC_NUMBER_RULES[lowerKey];
            }

            playArabicHumanAudio(spokenText, vol, function() {
              fallbackToWebSpeech(spokenText, 'ar-SA', vol);
            });
            return;
          }

          fallbackToWebSpeech(spokenText, 'en-US', vol);
        } catch (err) {
          console.warn('speakTextDirect error:', err);
        }
      }

      // Natural speech pronunciation for vocabulary and questions in English & Arabic
      window.speakAsdWord = function(text, lang, volume) {
        speakTextDirect(text, lang, volume);
      };

      // Audio file playback with instant native speech streaming fallback
      window.playAsdAudio = function(url, volume, fallbackText, lang) {
        const vol = typeof volume === 'number' ? Math.max(0, Math.min(1, volume)) : 0.8;
        const isAr = (lang === 'ar') || (fallbackText && /[\u0600-\u06FF]/.test(fallbackText)) || (url && url.includes('/ar/'));

        window.stopAsdAudio();

        // If a real external audio file URL is supplied, play it
        if (url && (url.startsWith('http://') || url.startsWith('https://')) && !url.includes('undefined')) {
          try {
            const audio = document.createElement('audio');
            audio.setAttribute('referrerpolicy', 'no-referrer');
            audio.referrerPolicy = 'no-referrer';
            audio.volume = vol;
            window._activeAsdAudio = audio;

            var hasHandled = false;
            function onFail() {
              if (!hasHandled && fallbackText) {
                hasHandled = true;
                speakTextDirect(fallbackText, lang, vol);
              }
            }

            audio.onerror = onFail;
            audio.src = url;
            const p = audio.play();
            if (p !== undefined) {
              p.catch(onFail);
              return;
            }
            return;
          } catch (_) {}
        }

        // Direct voice pronunciation for vocabulary items & prompts
        const targetText = fallbackText || url;
        if (targetText) {
          speakTextDirect(targetText, isAr ? 'ar' : (lang || 'en'), vol);
        }
      };

      // Halts any active audio or speech
      window.stopAsdAudio = function() {
        try {
          if (window._activeAsdAudio) {
            window._activeAsdAudio.pause();
            window._activeAsdAudio.currentTime = 0;
            window._activeAsdAudio = null;
          }
          if (window.speechSynthesis && window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
          }
        } catch (_) {}
      };
    })();

  <!-- Auto-dismiss preloader on Flutter first frame -->
  <script>
    (function() {
      var dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('app-loading-indicator');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 450);
        }
      }

      window.addEventListener('flutter-first-frame', dismissSplash);

      var observer = new MutationObserver(function() {
        if (document.querySelector('flt-glass-pane') || 
            document.querySelector('flutter-view') || 
            document.querySelector('flt-scene-host')) {
          setTimeout(dismissSplash, 150);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(dismissSplash, 10000);
    })();
  </script>
